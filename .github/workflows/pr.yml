name: PR checks

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: |
          brew update
          brew install swiftlint
      - run: |
          swiftlint lint \
            --reporter github-actions-logging \
            --force-exclude || {
              code=$?
              if [ $code -eq 1 ]; then
                echo "No Swift files found in $dir, skipping"
              else
                exit $code
              fi
            }

  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select latest Xcode
        run: bash .github/actions/build-and-tests/scripts/select-xcode.sh
      - run: echo "MD_APPLE_SDK_ROOT=" >> "$GITHUB_ENV"
      - run: |
          git ls-files -z '*.swift' | xargs -0 swift format lint --strict --parallel

  swiftformat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: |
          brew update
          brew install swiftformat
      - run: |
          swiftformat --lint --strict . \
            --reporter github-actions-log

  prepare:
    runs-on: macos-latest
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select latest Xcode
        run: bash .github/actions/build-and-tests/scripts/select-xcode.sh
      - run: .github/actions/build-and-tests/scripts/neutralize-sdk.sh
      - name: Download platform SDKs
        run: .github/actions/build-and-tests/scripts/download-platforms.sh iOS tvOS
      - run: .github/actions/build-and-tests/scripts/prepare-workspace.sh
      - id: scheme
        run: .github/actions/build-and-tests/scripts/prepare-scheme.sh

  build:
    runs-on: macos-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
          - platform: tvos
          - platform: visionos
          - platform: macCatalyst
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select latest Xcode
        run: bash .github/actions/build-and-tests/scripts/select-xcode.sh

      - run: echo "MD_APPLE_SDK_ROOT=" >> "$GITHUB_ENV"

      - name: Download platform SDK
        if: matrix.platform == 'ios' || matrix.platform == 'tvos'
        run: |
          case "${{ matrix.platform }}" in
            ios)  .github/actions/build-and-tests/scripts/download-platforms.sh iOS ;;
            tvos) .github/actions/build-and-tests/scripts/download-platforms.sh tvOS ;;
          esac

      - name: Resolve destinations on this runner
        id: local_dest
        env:
          SCHEME: ${{ needs.prepare.outputs.scheme }}
        run: .github/actions/build-and-tests/scripts/resolve-destinations.sh

      - name: Select destination
        id: pick
        run: |
          case "${{ matrix.platform }}" in
            ios) echo "DEST=${{ steps.local_dest.outputs.ios_dest }}" >> "$GITHUB_ENV" ;;
            tvos) echo "DEST=${{ steps.local_dest.outputs.tvos_dest }}" >> "$GITHUB_ENV" ;;
            visionos) echo "DEST=${{ steps.local_dest.outputs.visionos_dest }}" >> "$GITHUB_ENV" ;;
            macCatalyst) echo "DEST=${{ steps.local_dest.outputs.maccatalyst_dest }}" >> "$GITHUB_ENV" ;;
          esac
          echo "Platform=${{ matrix.platform }}"
          echo "Destination=$DEST"

      - name: Build ${{ matrix.platform }}
        env:
          SCHEME: ${{ needs.prepare.outputs.scheme }}
          DESTINATION: ${{ env.DEST }}
        run: .github/actions/build-and-tests/scripts/build.sh

  tests:
    runs-on: macos-latest
    needs: prepare
    permissions:
        contents: read
        pull-requests: write
        checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select latest Xcode
        run: bash .github/actions/build-and-tests/scripts/select-xcode.sh

      - run: echo "MD_APPLE_SDK_ROOT=" >> "$GITHUB_ENV"

      - name: Download platform SDK
        run: |
          case "${{ matrix.platform }}" in
            ios)  .github/actions/build-and-tests/scripts/download-platforms.sh iOS ;;
            tvos) .github/actions/build-and-tests/scripts/download-platforms.sh tvOS ;;
          esac

      - name: Resolve destinations on this runner
        id: local_dest
        env:
          SCHEME: ${{ needs.prepare.outputs.scheme }}
        run: .github/actions/build-and-tests/scripts/resolve-destinations.sh

      - name: Select destination
        id: pick
        run: |
          case "${{ matrix.platform }}" in
            ios) echo "DEST=${{ steps.local_dest.outputs.ios_dest }}" >> "$GITHUB_ENV" ;;
            tvos) echo "DEST=${{ steps.local_dest.outputs.tvos_dest }}" >> "$GITHUB_ENV" ;;
            visionos) echo "DEST=${{ steps.local_dest.outputs.visionos_dest }}" >> "$GITHUB_ENV" ;;
            macCatalyst) echo "DEST=${{ steps.local_dest.outputs.maccatalyst_dest }}" >> "$GITHUB_ENV" ;;
          esac
          echo "Platform=${{ matrix.platform }}"
          echo "Destination=$DEST"

      - name: Run tests (${{ matrix.platform }})
        id: test
        env:
          SCHEME: ${{ needs.prepare.outputs.scheme }}
          DESTINATION: ${{ env.DEST }}
        run: |
          export GITHUB_OUTPUT="$(mktemp)"
          .github/actions/build-and-tests/scripts/test.sh
          code=$?
          echo "xcode_status=$code" >> "$GITHUB_OUTPUT"

      - name: Publish JUnit to Checks
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: always()
        with:
          report_paths: reports/junit-${{ matrix.platform }}.xml
          check_name: Tests (${{ matrix.platform }})
          require_tests: true
          include_passed: true
          fail_on_failure: false
          detailed_summary: true

      - name: Upload .xcresult artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: xcresult-${{ matrix.platform }}.xcresult
          path: TestResults_${{ matrix.platform }}.xcresult
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
