name: Build XCFrameworks

# Trigger manually to build and validate the complete binary distribution.
# Session Replay source is checked out from its private repository using a
# read-only repository token.
#
# Architecture:
#   Job 1 (build): Build OTel + dynamic Session Replay + static Agent modules → upload artifact
#   Job 2 (sign-and-release): Optional signing, validation, and packaging

on:
  workflow_dispatch:
    inputs:
      otel-version:
        description: "OpenTelemetry Swift Core version"
        required: false
        default: "2.3.0"
        type: string
      session-replay-ref:
        description: "Branch, tag, or commit of smartlook-ios-sdk-private"
        required: false
        default: "develop"
        type: string
      skip-signing:
        description: "Skip code signing (for local testing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  OTEL_VERSION: ${{ inputs.otel-version || '2.3.0' }}

jobs:

  # ===========================================================================
  # Job 1: Build all xcframeworks
  # ===========================================================================
  build:
    name: Build XCFrameworks
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Select latest Xcode
        run: bash .github/actions/build-and-tests/scripts/select-xcode.sh

      - name: Install Tuist
        run: |
          brew install tuist
          tuist version

      # -----------------------------------------------------------------
      # Step 1: Check out private Session Replay source
      # -----------------------------------------------------------------
      - name: Check Session Replay repository credential
        env:
          SESSION_REPLAY_READ_TOKEN: ${{ secrets.SESSION_REPLAY_READ_TOKEN }}
        run: |
          if [ -z "$SESSION_REPLAY_READ_TOKEN" ]; then
            echo "::error::Configure SESSION_REPLAY_READ_TOKEN with read access to smartlook-ios-sdk-private"
            exit 1
          fi

      - name: Checkout Session Replay source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: smartlook/smartlook-ios-sdk-private
          ref: ${{ inputs.session-replay-ref }}
          token: ${{ secrets.SESSION_REPLAY_READ_TOKEN }}
          path: tools/xcframework/session-replay
          persist-credentials: false

      # -----------------------------------------------------------------
      # Step 2: Build the full distribution with dynamic Session Replay frameworks
      # -----------------------------------------------------------------
      - name: Build complete XCFramework distribution
        working-directory: tools/xcframework
        env:
          SESSION_REPLAY_LOCAL_PATH: ${{ github.workspace }}/tools/xcframework/session-replay
          CISCO_MACH_O_TYPE: mh_dylib
        run: make clean build

      # -----------------------------------------------------------------
      # Step 3: Validate (pre-signing)
      # -----------------------------------------------------------------
      - name: Validate xcframeworks (pre-signing)
        working-directory: tools/xcframework
        run: RELEASE=false scripts/validate-xcframeworks.sh

      # -----------------------------------------------------------------
      # Step 4: Smoke test (consumer linkage)
      # -----------------------------------------------------------------
      - name: Run smoke test
        working-directory: tools/xcframework
        run: scripts/run-smoke-test.sh

      # -----------------------------------------------------------------
      # Step 5: Upload build artifacts
      # -----------------------------------------------------------------
      - name: Upload xcframeworks artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splunk-agent-xcframeworks-unsigned
          path: tools/xcframework/output/
          retention-days: 7


  # ===========================================================================
  # Job 2: Sign, validate, and package
  # ===========================================================================
  # NOTE: This job is temporarily disabled because distribution certificates
  # cannot be stored in GitHub secrets per current policy.
  #
  # Signing is done locally instead using:
  #   tools/xcframework/scripts/sign-and-upload.sh <VERSION>
  #
  # To re-enable automated signing, set the SIGNING_ENABLED repository
  # variable to "true" and configure the DISTRIBUTION_CERTIFICATE and
  # CERTIFICATE_PASSWORD secrets.
  sign-and-release:
    name: Sign & Package
    needs: build
    runs-on: macos-15
    if: ${{ vars.SIGNING_ENABLED == 'true' && !inputs.skip-signing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download xcframeworks artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: splunk-agent-xcframeworks-unsigned
          path: tools/xcframework/output/

      # -----------------------------------------------------------------
      # Signing
      # -----------------------------------------------------------------
      - name: Set up signing keychain
        id: signing
        uses: ./.github/actions/setup-signing
        with:
          distribution-certificate: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          certificate-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Sign xcframeworks
        working-directory: tools/xcframework
        run: |
          chmod +x scripts/*.sh
          scripts/sign-xcframeworks.sh "${{ steps.signing.outputs.signing-identity }}"

      # -----------------------------------------------------------------
      # Post-signing validation
      # -----------------------------------------------------------------
      - name: Validate xcframeworks (post-signing)
        working-directory: tools/xcframework
        run: RELEASE=true scripts/validate-xcframeworks.sh

      # -----------------------------------------------------------------
      # Generate dependency manifest
      # -----------------------------------------------------------------
      - name: Generate dependency manifest
        working-directory: tools/xcframework
        run: scripts/generate-dependency-manifest.sh

      # -----------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            # For manual dispatch, read version from SplunkRum.swift
            VERSION="$(awk 'match($0,/public[[:space:]]+static[[:space:]]+let[[:space:]]+version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"/,a){print a[1]; exit}' \
              SplunkAgent/Sources/SplunkAgent/Public\ API/SplunkRum.swift)"
            echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package xcframeworks
        working-directory: tools/xcframework
        run: |
          scripts/release.sh "${{ steps.version.outputs.version }}"

      # -----------------------------------------------------------------
      # Upload signed artifact
      # -----------------------------------------------------------------
      - name: Upload signed xcframeworks artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: splunk-agent-xcframeworks-${{ steps.version.outputs.version }}
          path: tools/xcframework/output/SplunkAgent-XCFrameworks*.zip
          retention-days: 30
