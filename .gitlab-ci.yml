stages:
  - report

variables:
  GITHUB_API_BASE_URL: "https://api.github.com"
  GITHUB_OWNER: "signalfx"
  GITHUB_REPO: "splunk-otel-ios"
  PR_REVIEW_REPORT_OUTPUT: "artifacts/pr-review-report.txt"

pr-review-report:
  stage: report
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  script:
    - mkdir -p "$(dirname "$PR_REVIEW_REPORT_OUTPUT")"
    - python3 tools/pr_review_report/generate_report.py --api-base-url "$GITHUB_API_BASE_URL" --owner "$GITHUB_OWNER" --repo "$GITHUB_REPO" --output "$PR_REVIEW_REPORT_OUTPUT"
    - cat "$PR_REVIEW_REPORT_OUTPUT"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/pr-review-report.txt
