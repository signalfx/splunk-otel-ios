workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

default:
  tags:
    - mrumios # MacStadium ARM64 runner with Xcode and simulator runtimes

stages:
  - prepare
  - build
  - test

variables:
  IOS_DEST:     "platform=iOS Simulator,id=A555A42C-52BD-4290-A8A2-C2CE490E1611"
  TVOS_DEST:    "platform=tvOS Simulator,id=7B8C51BA-C853-4710-AC0B-7265C9D4F183"
  VISIONOS_DEST: "platform=visionOS Simulator,id=A1F85265-ED34-4D07-B5BD-792E10238D42"
  MACCAT_DEST:  "platform=macOS,variant=Mac Catalyst"

# ---------------------------------------------------------------------------
# prepare: resolve scheme name, pass to later jobs via dotenv artifact
# ---------------------------------------------------------------------------
prepare:
  stage: prepare
  script:
    - |
      WS=".swiftpm/xcode/package.xcworkspace"
      xcodebuild -resolvePackageDependencies
      xed -b .
      RAW="$(xcodebuild -list -workspace "$WS" -json 2>/dev/null | sed -n '/^{/,$p' || true)"
      if [ -n "$RAW" ] && command -v jq >/dev/null 2>&1 && echo "$RAW" | jq -e '.workspace.schemes | length > 0' >/dev/null 2>&1; then
        NAME="$(echo "$RAW" | jq -r '.workspace.schemes[] | select(test("-Package$"))' | head -n1)"
        if [ -z "${NAME:-}" ] || [ "$NAME" = "null" ]; then
          NAME="$(echo "$RAW" | jq -r '.workspace.schemes[0]')"
        fi
      else
        PKG="$(swift package describe --type json 2>/dev/null | jq -r '.name' || true)"
        NAME="${PKG}-Package"
      fi
      echo "SCHEME=$NAME" > prepare.env
      echo "[prepare] scheme=$NAME"
  artifacts:
    reports:
      dotenv: prepare.env

# ---------------------------------------------------------------------------
# build: matrix over ios / tvos / visionos / macCatalyst
# ---------------------------------------------------------------------------
build:
  stage: build
  needs:
    - job: prepare
      artifacts: true
  parallel:
    matrix:
      - PLATFORM: [ios, tvos, visionos, macCatalyst]
  script:
    - |
      case "$PLATFORM" in
        ios)         DESTINATION="$IOS_DEST" ;;
        tvos)        DESTINATION="$TVOS_DEST" ;;
        visionos)    DESTINATION="$VISIONOS_DEST" ;;
        macCatalyst) DESTINATION="$MACCAT_DEST" ;;
      esac
      export SCHEME DESTINATION
      .github/actions/build-and-tests/scripts/build.sh

# ---------------------------------------------------------------------------
# tests: iOS only
# ---------------------------------------------------------------------------
tests:
  stage: test
  needs:
    - job: prepare
      artifacts: true
  script:
    - mkdir -p reports
    - export GITHUB_OUTPUT="$(mktemp)"
    - DESTINATION="$IOS_DEST" SCHEME="$SCHEME" .github/actions/build-and-tests/scripts/test.sh
    - rm -f "$GITHUB_OUTPUT"
  artifacts:
    when: always
    paths:
      - reports/
      - "*.xcresult"
    reports:
      junit: reports/junit-ios.xml
